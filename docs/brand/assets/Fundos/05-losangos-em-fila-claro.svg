<g fill="none" stroke="#a56038" stroke-linecap="round" stroke-linejoin="round">
<rect x="400.0" y="210.0" width="220" height="220" transform="rotate(45 510 320)" stroke-opacity="0.225" stroke-width="1"/>
<rect x="530.0" y="210.0" width="220" height="220" transform="rotate(45 640 320)" stroke-opacity="0.338" stroke-width="1"/>
<rect x="660.0" y="210.0" width="220" height="220" transform="rotate(45 770 320)" stroke-opacity="0.450" stroke-width="1"/>
<rect x="790.0" y="210.0" width="220" height="220" transform="rotate(45 900 320)" stroke-opacity="0.562" stroke-width="1.5"/>
<rect x="920.0" y="210.0" width="220" height="220" transform="rotate(45 1030 320)" stroke-opacity="0.450" stroke-width="1"/>
<rect x="1050.0" y="210.0" width="220" height="220" transform="rotate(45 1160 320)" stroke-opacity="0.338" stroke-width="1"/>
<rect x="1180.0" y="210.0" width="220" height="220" transform="rotate(45 1290 320)" stroke-opacity="0.225" stroke-width="1"/>
<rect x="1310.0" y="210.0" width="220" height="220" transform="rotate(45 1420 320)" stroke-opacity="0.113" stroke-width="1"/>
