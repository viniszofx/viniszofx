<rect x="1180.0" y="210.0" width="220" height="220" transform="rotate(45 1290 320)" stroke-opacity="0.261" stroke-width="1"/>
<rect x="1310.0" y="210.0" width="220" height="220" transform="rotate(45 1420 320)" stroke-opacity="0.131" stroke-width="1"/>
